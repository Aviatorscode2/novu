apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "novu.fullname" . }}-config
  labels:
    {{- include "novu.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.env.nodeEnv | quote }}
  API_ROOT_URL: {{ .Values.env.apiRootUrl | quote }}
  API_PORT: {{ .Values.env.apiPort | quote }}
  FRONT_BASE_URL: {{ .Values.env.frontBaseUrl | quote }}
  WS_PORT: {{ .Values.env.wsPort | quote }}
  WS_CONTEXT_PATH: {{ .Values.env.wsContextPath | quote }}
  MONGO_URL: {{ .Values.env.mongoUrl | quote }}
  MONGO_MIN_POOL_SIZE: {{ .Values.env.mongoMinPoolSize | quote }}
  MONGO_MAX_POOL_SIZE: {{ .Values.env.mongoMaxPoolSize | quote }}
  MONGO_AUTO_CREATE_INDEXES: {{ .Values.env.mongoAutoCreateIndexes | quote }}
  REDIS_HOST: {{ .Values.env.redisHost | quote }}
  REDIS_PORT: {{ .Values.env.redisPort | quote }}
  REDIS_DB_INDEX: {{ .Values.env.redisDbIndex | quote }}
  REDIS_CACHE_SERVICE_HOST: {{ .Values.env.redisCacheServiceHost | quote }}
  REDIS_CACHE_SERVICE_PORT: {{ .Values.env.redisCacheServicePort | quote }}
  S3_LOCAL_STACK: {{ .Values.env.s3LocalStack | quote }}
  S3_BUCKET_NAME: {{ .Values.env.s3BucketName | quote }}
  S3_REGION: {{ .Values.env.s3Region | quote }}
  SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: {{ .Values.env.subscriberWidgetJwtExpirationTime | quote }}
  SENTRY_DSN: {{ .Values.env.sentryDsn | quote }}
  NEW_RELIC_ENABLED: {{ .Values.env.newRelicEnabled | quote }}
  NEW_RELIC_APP_NAME: {{ .Values.env.newRelicAppName | quote }}
  API_CONTEXT_PATH: {{ .Values.env.apiContextPath | quote }}
  IS_API_IDEMPOTENCY_ENABLED: {{ .Values.env.isApiIdempotencyEnabled | quote }}
  IS_API_RATE_LIMITING_ENABLED: {{ .Values.env.isApiRateLimitingEnabled | quote }}
  IS_NEW_MESSAGES_API_RESPONSE_ENABLED: {{ .Values.env.isNewMessagesApiResponseEnabled | quote }}
  IS_V2_ENABLED: {{ .Values.env.isV2Enabled | quote }}
  BROADCAST_QUEUE_CHUNK_SIZE: {{ .Values.env.broadcastQueueChunkSize | quote }}
  MULTICAST_QUEUE_CHUNK_SIZE: {{ .Values.env.multicastQueueChunkSize | quote }}
  IS_EMAIL_INLINE_CSS_DISABLED: {{ .Values.env.isEmailInlineCssDisabled | quote }}
  IS_USE_MERGED_DIGEST_ID_ENABLED: {{ .Values.env.isUseMergedDigestIdEnabled | quote }}
  VITE_API_HOSTNAME: {{ .Values.env.viteApiHostname | quote }}
  VITE_SELF_HOSTED: "true"
  VITE_WEBSOCKET_HOSTNAME: {{ .Values.env.viteWebsocketHostname | quote }}
